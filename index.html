<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7f5"><link rel="manifest" href="manifest.json"><title>Progress Tracker</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f5;color:#20332c;font:15px system-ui,sans-serif}main,header{max-width:1000px;margin:auto;padding:18px}header{padding-bottom:0}h1{margin:0;font-size:27px}h2{font-size:20px}h3{font-size:16px;margin:0 0 8px}small,.muted{color:#687970}nav{display:flex;gap:6px;overflow:auto;padding:14px 0}button,input,select{font:inherit;border:1px solid #cbd8d0;border-radius:8px;padding:9px;background:white;color:inherit}button{cursor:pointer}button:hover{background:#e5f1e9}button.primary,nav button.active{background:#287653;color:white;border-color:#287653}button.danger{color:#a33}button:disabled{opacity:.5;cursor:default}.card{background:white;border:1px solid #dce5df;border-radius:13px;padding:16px;margin:10px 0}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1}.bar{height:8px;background:#e5ebe7;border-radius:10px;overflow:hidden;margin:9px 0}.bar i{display:block;height:100%;background:#489b79}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:12px}.metric strong{display:block;font-size:25px;margin-top:5px}.metric{padding:8px 0}.amount{width:90px}.green{color:#287653}.form{display:grid;gap:10px}.form label{display:grid;gap:4px}.form input,.form select{width:100%}.form label.check{display:flex;align-items:center;gap:8px}.form input[type=checkbox]{width:auto}.progress{margin-top:9px}.progress>strong,.progress>small{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:350px}.heat div{border-radius:4px;aspect-ratio:1;display:grid;place-items:center;font-size:11px}.blank{background:#edf0ee}.skip{background:#e8b4b4}.done{background:#a5d6b4}.high{background:#287653;color:white}.empty{padding:15px;color:#687970;border:1px dashed #cbd8d0;border-radius:10px}.chart{width:100%;height:150px}dialog{border:1px solid #cbd8d0;border-radius:12px;width:min(92vw,480px);color:inherit}dialog::backdrop{background:#0005}footer{text-align:center;color:#687970;padding:20px} @media(max-width:500px){main,header{padding:12px}.card{padding:12px}button{padding:8px}.metrics{gap:5px}.metric strong{font-size:21px}}
</style></head><body><header><div class="row between"><h1>Progress Tracker</h1><small>Version 1.1</small></div><nav id="nav"></nav></header><main id="app"></main><dialog id="dlg"></dialog><footer>Deine Daten bleiben auf diesem Gerät.</footer><script>
const KEY='progress-tracker-v1';const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const dateObj=s=>new Date(s+'T12:00:00');const fmt=s=>dateObj(s).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});const num=n=>Number(n).toLocaleString('de-DE',{maximumFractionDigits:4});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let state={tasks:[],logs:{},projects:[]};try{let s=localStorage.getItem(KEY);if(s)state=JSON.parse(s)}catch(e){alert('Gespeicherte Daten konnten nicht gelesen werden. Bitte Backup prüfen.')}let tab='Dashboard',day=today(),period=30,statId='',lastToday=today();const app=document.getElementById('app'),dlg=document.getElementById('dlg');const tabs=['Dashboard','Projekte','Statistik','Stammdaten','Backup'];const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);const task=id=>state.tasks.find(t=>t.id===id);const log=(id,d)=>state.logs[id]?.[d];const entries=t=>Object.entries(state.logs[t.id]||{});const total=t=>Number(t.base||0)+entries(t).reduce((s,[d,l])=>s+(l.status==='done'?Number(l.amount||0):0),0);const project=t=>state.projects.find(p=>p.id===t.project)?.name||'';const pct=t=>t.status==='complete'?100:t.target>0?Math.min(100,total(t)/t.target*100):t.estimate!==null&&t.estimate!==undefined?Number(t.estimate):null;const bar=p=>`<div class="bar"><i style="width:${Math.max(0,Math.min(100,p))}%"></i></div>`;const metric=(a,b)=>`<div class="metric"><small>${a}</small><strong>${b}</strong></div>`;function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('Speichern fehlgeschlagen. Bitte sofort Backup exportieren.')}render()}
function dates(a,b){let out=[];if(!a||a>b)return out;for(let d=dateObj(a);d<=dateObj(b);d.setDate(d.getDate()+1)){out.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`)}return out}function shift(s,n){let d=dateObj(s);d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function eligible(t,d){return d>=t.start&&(!t.finished||d<=t.finished)&&!(t.pauses||[]).some(p=>d>=p.from&&(!p.to||d<p.to))}function stats(t,n=0){let end=t.finished&&t.finished<today()?t.finished:today();let start=n? [t.start,shift(today(),1-n)].sort().pop():t.start;let ds=dates(start,end).filter(d=>eligible(t,d));let active=ds.filter(d=>log(t.id,d)?.status==='done');let denom=ds.filter(d=>d<today()||log(t.id,d)).length;let sum=active.reduce((s,d)=>s+Number(log(t.id,d).amount||0),0);let streak=0;for(let d of [...ds].reverse()){if(d===today()&&!log(t.id,d))continue;if(log(t.id,d)?.status==='done')streak++;else break}return {ds,active:active.length,denom,rate:denom?active.length/denom*100:null,sum,streak}}
function consistency(s){return s.rate===null?'–':num(s.rate)+' %'}function record(id,status,amount=0){let t=task(id);if(!t)return;let old=log(id,day);state.logs[id]??={};state.logs[id][day]={status,amount:status==='done'?((old?.status==='done'?old.amount:0)+amount):0};if(t.target>0&&!t.targetEstimated&&total(t)>=t.target&&t.status==='active'){t.status='complete';t.finished=day;t.auto=true}save()}function add(id){let el=document.getElementById('a-'+id);let a=Number(el.value);if(!Number.isFinite(a)||a<=0){el.focus();return}record(id,'done',a)}function undo(id){if(!confirm('Heutigen bzw. ausgewählten Eintrag vollständig entfernen?'))return;delete state.logs[id]?.[day];let t=task(id);if(t.auto&&total(t)<t.target){t.status='active';t.finished=null;t.auto=false}save()}
function progress(t){let p=pct(t);return `<div class="progress">`+(p===null?'':`<strong>${num(p)} %${(t.targetEstimated||!t.target)&&t.status!=='complete'?' (geschätzt)':''}</strong>${bar(p)}`)+`<small>${t.unit||t.target?`${num(total(t))}${t.target?' von '+(t.targetEstimated?'ca. ':'')+num(t.target):''} ${esc(t.unit||'Einheiten')}`:`${stats(t).active} aktive Tage`}</small>${t.targetEstimated&&t.status!=='complete'&&total(t)>=t.target?'<small>Schätzziel erreicht – tatsächlichen Abschluss bestätigen oder Gesamtmenge anpassen.</small>':''}</div>`}function taskCard(t){let l=log(t.id,day),done=l?.status==='done';return `<div class="card"><div class="row between"><div><h3>${esc(t.name)}</h3><small>${esc(project(t))}</small></div>${t.status==='complete'?'<span class="green">Gesamtziel erreicht</span>':''}</div>${progress(t)}${done?`<p class="green">✓ ${l.amount>0?num(l.amount)+' '+esc(t.unit||'Einheiten'):'Etwas gemacht'}</p>`:''}<div class="row" style="margin-top:12px">${!l?`<button onclick="record('${t.id}','done')">✓ Etwas gemacht</button>`:''}${t.unit||t.target?`${done?`<button onclick="record('${t.id}','done',1)">+1</button>`:''}<input class="amount" id="a-${t.id}" type="number" min="0" step="any" placeholder="Anzahl" onkeydown="if(event.key==='Enter')add('${t.id}')"><button class="primary" onclick="add('${t.id}')">${done?'Hinzufügen':'+'}</button>`:''}${!l?`<button onclick="record('${t.id}','skip')">Nichts</button>`:`<button onclick="undo('${t.id}')">↶ Rückgängig</button>`}</div></div>`}
function dashboard(){let ts=state.tasks.filter(t=>eligible(t,day)||log(t.id,day));let open=ts.filter(t=>!log(t.id,day)&&(!t.finished||day<t.finished||t.status==='active')),done=ts.filter(t=>log(t.id,day)?.status==='done'),skip=ts.filter(t=>log(t.id,day)?.status==='skip');let count=open.length+done.length+skip.length;let r=count?done.length/count*100:0;return `<div class="row between"><h2>${day===today()?'Heute':fmt(day)}</h2><div class="row"><button onclick="changeDay(-1)">‹</button><input type="date" value="${day}" max="${today()}" onchange="day=this.value||today();render()"><button ${day>=today()?'disabled':''} onclick="changeDay(1)">›</button><button onclick="day=today();render()">Heute</button></div></div><div class="card"><div class="metrics">${metric('Aktiv',done.length+'/'+count)}${metric('Noch offen',open.length)}${metric('Tagesfortschritt',num(r)+' %')}</div>${bar(r)}</div><h2>Noch offen (${open.length})</h2>${open.map(taskCard).join('')||'<div class="empty">Keine offenen Aufgaben.</div>'}<h2 class="green">Bereits etwas gemacht (${done.length})</h2>${done.map(taskCard).join('')||'<div class="empty">Noch keine Aktivität erfasst.</div>'}${skip.length?`<h2>Nichts gemacht (${skip.length})</h2>${skip.map(taskCard).join('')}`:''}${!state.tasks.length?'<button class="primary" onclick="tab=\'Stammdaten\';render();editTask()">Erste Aufgabe anlegen</button>':''}`}
function changeDay(n){day=shift(day,n);if(day>today())day=today();render()}
function projects(){let groups=[...state.projects,{id:'',name:'Einzelaufgaben'}];return `<div class="row between"><h2>Projekte</h2><button class="primary" onclick="editProject()">+ Projekt</button></div>`+groups.map(p=>{let ts=state.tasks.filter(t=>(t.project||'')===p.id);if(!ts.length&&!p.id)return '';let known=ts.map(pct).filter(v=>v!==null);let planned=p.plannedTasks||0, slots=Math.max(planned,ts.length), missing=Math.max(0,planned-ts.length), denom=known.length+missing;let val=denom?known.reduce((a,b)=>a+b,0)/denom:null;let estimated=ts.some(t=>t.status!=='complete'&&(t.targetEstimated||(!t.target&&t.estimate!=null)));if(planned)val=slots?known.reduce((a,b)=>a+b,0)/slots:null;let ds=[...new Set(ts.flatMap(t=>stats(t).ds))].filter(d=>d<today()||ts.some(t=>log(t.id,d)));let active=ds.filter(d=>ts.some(t=>eligible(t,d)&&log(t.id,d)?.status==='done')).length;return `<div class="card"><div class="row between"><h3>${esc(p.name)}</h3>${val===null?'':`<strong class="green">${num(val)} %${estimated?' (geschätzt)':''}</strong>`}</div>${val===null?'':bar(val)}${planned?`<p class="muted">${ts.filter(t=>t.status==='complete').length} von ${slots} Aufgaben abgeschlossen · ${ts.length} angelegt · ${missing} noch nicht angelegt${ts.length>planned?' · geplante Anzahl überschritten':''}</p>`:''}${known.length<ts.length?`<small>Berechenbar: ${known.length} von ${ts.length} Aufgaben; ${planned?'unbekannte Ziele vorläufig mit 0 % berücksichtigt.':'unbekannte Ziele nicht eingerechnet.'}</small>`:''}${ts.map(t=>`<div class="card"><div class="row between"><b>${esc(t.name)}</b><small>${statusText(t)}</small></div>${progress(t)}</div>`).join('')||'<p class="muted">Noch keine Aufgaben.</p>'}<div class="metrics">${metric('Aktive Tage',active+' / '+ds.length)}${metric('Konsistenz',ds.length?num(active/ds.length*100)+' %':'–')}</div></div>`}).join('')}
function statistics(){if(!state.tasks.length)return '<h2>Statistik</h2><div class="empty">Lege zuerst eine Aufgabe an.</div>';let t=task(statId)||state.tasks[0];statId=t.id;let s=stats(t,period),all=stats(t);let heat=dates(shift(today(),-27),today()).map(d=>{let l=log(t.id,d),ok=eligible(t,d),cl=!ok||!l?'blank':l.status==='skip'?'skip':l.amount>=5?'high':'done';return `<div class="${cl}" title="${fmt(d)}: ${!ok?'Nicht geplant':!l?'Nicht erfasst':l.status==='skip'?'Nichts gemacht':l.amount||'Aktiv'}">${!ok||!l?'–':l.status==='skip'?'0':l.amount?num(l.amount):'✓'}</div>`}).join('');let ds=s.ds;let points=ds.map(d=>Number(t.base||0)+entries(t).filter(([k,l])=>k<=d&&l.status==='done').reduce((a,[k,l])=>a+Number(l.amount||0),0));let max=Math.max(1,...points),poly=points.map((v,i)=>`${10+i*280/Math.max(1,points.length-1)},${125-v/max*105}`).join(' ');return `<h2>Statistik</h2><div class="row"><select onchange="statId=this.value;render()">${state.tasks.map(x=>`<option value="${x.id}" ${x.id===t.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><select onchange="period=Number(this.value);render()">${[7,30,90,0].map(n=>`<option value="${n}" ${period===n?'selected':''}>${n?n+' Tage':'Seit Beginn'}</option>`).join('')}</select></div><div class="card"><div class="metrics">${metric('Konsistenz',consistency(s))}${metric('Aktive Tage',s.active+' / '+s.denom)}${metric('Insgesamt',t.unit||t.target?num(total(t))+' '+esc(t.unit||''):all.active+' Tage')}${metric('Ø pro aktivem Tag',t.unit||t.target?s.active?num(s.sum/s.active):'–':'–')}${metric('Aktuelle Serie',all.streak+' Tage')}</div><h3>Letzte 28 Tage</h3><div class="heat">${heat}</div><p><small>– nicht erfasst / nicht geplant · 0 nichts · ✓ aktiv · Zahl = Menge</small></p>${t.unit||t.target?`<h3>Kumulativer Fortschritt</h3><svg class="chart" viewBox="0 0 300 140" role="img" aria-label="Kumulativer Fortschritt"><path d="M10 10 V125 H290" fill="none" stroke="#cbd8d0"/><polyline points="${poly}" fill="none" stroke="#287653" stroke-width="2.5"/></svg><div class="row between"><small>${ds[0]?fmt(ds[0]):'–'}</small><small>${num(points.at(-1)||0)} ${esc(t.unit||'')}</small><small>${ds.length?fmt(ds.at(-1)):'–'}</small></div>`:''}</div><h3>Historie</h3>${ds.slice().reverse().map(d=>{let l=log(t.id,d);return `<div class="card row between"><span>${fmt(d)}</span><span>${!l?'Nicht erfasst':l.status==='skip'?'Nichts gemacht':l.amount?num(l.amount)+' '+esc(t.unit||''):'Etwas gemacht'}</span><button onclick="day='${d}';tab='Dashboard';render()">Bearbeiten</button></div>`}).join('')}`}
function statusText(t){return {active:'Laufend',paused:'Pausiert',complete:'Abgeschlossen'}[t.status]}function master(){return `<div class="row between"><h2>Stammdaten</h2><button class="primary" onclick="editTask()">+ Aufgabe</button><button onclick="editProject()">+ Projekt</button></div>${state.projects.map(p=>`<div class="card row between"><div><b>${esc(p.name)}</b>${p.plannedTasks?`<div><small>${state.tasks.filter(t=>t.project===p.id).length} von ${p.plannedTasks} Aufgaben angelegt</small></div>`:''}</div><button onclick="editProject('${p.id}')">Projekt bearbeiten</button></div>`).join('')}${state.tasks.map(t=>`<div class="card"><div class="row between"><h3>${esc(t.name)}</h3><small>${statusText(t)}</small></div><small>${project(t)?esc(project(t))+' · ':''}seit ${fmt(t.start)}</small>${progress(t)}<div class="row" style="margin-top:12px"><button onclick="editTask('${t.id}')">Bearbeiten</button>${t.status==='active'?`<button onclick="setStatus('${t.id}','paused')">Pausieren</button><button onclick="setStatus('${t.id}','complete')">Abschließen</button>`:`<button onclick="setStatus('${t.id}','active')">Reaktivieren</button>`}<button class="danger" onclick="deleteTask('${t.id}')">Löschen</button></div></div>`).join('')||'<div class="empty">Noch keine Aufgaben.</div>'}`}
function setStatus(id,status){let t=task(id),d=today();if(status==='complete'&&!confirm('Aufgabe vollständig abschließen? Die Historie bleibt erhalten.'))return;if(t.status==='paused'){let p=t.pauses.at(-1);if(p&&!p.to)p.to=d}if(status==='paused'){t.pauses??=[];t.pauses.push({from:d,to:null})}t.status=status;t.finished=status==='complete'?d:null;t.auto=false;save()}function deleteTask(id){if(confirm('Aufgabe einschließlich aller bisherigen Einträge endgültig löschen?')){state.tasks=state.tasks.filter(t=>t.id!==id);delete state.logs[id];save()}}
function editTask(id){let t=task(id)||{name:'',project:'',unit:'',target:null,base:0,estimate:null,start:today()};dlg.innerHTML=`<form class="form" id="taskform"><h2>${id?'Aufgabe bearbeiten':'Neue Aufgabe'}</h2><label>Name<input name="name" required value="${esc(t.name)}"></label><label>Projekt (optional)<select name="project"><option value="">Kein Projekt</option>${state.projects.map(p=>`<option value="${p.id}" ${p.id===t.project?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label><label>Einheit (optional)<input name="unit" value="${esc(t.unit)}" placeholder="z. B. Teile, Seiten, Minuten"></label><label>Gesamtmenge (optional)<input name="target" type="number" min="0.0001" step="any" value="${t.target??''}"></label><label class="check"><input type="checkbox" name="targetEstimated" ${t.targetEstimated?'checked':''}> Gesamtmenge geschätzt</label><small>Bei geschätzter Gesamtmenge wird der Fortschritt berechnet, aber die Aufgabe nicht automatisch abgeschlossen.</small><label>Bereits geschafft (vor Erfassung)<input name="base" type="number" min="0" step="any" value="${t.base||0}"></label><label>Geschätzter Fortschritt in % (nur ohne Gesamtmenge)<input name="estimate" type="number" min="0" max="100" step="any" value="${t.estimate??''}"></label><label>Startdatum<input name="start" type="date" required value="${t.start}"></label><small>Die Aufgabe erscheint täglich bis zum Abschluss oder einer Pause.</small><div class="row"><button type="submit" class="primary">Speichern</button><button type="button" onclick="dlg.close()">Abbrechen</button></div></form>`;dlg.showModal();document.getElementById('taskform').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);let vals={name:f.get('name').trim(),project:f.get('project'),unit:f.get('unit').trim(),target:f.get('target')?Number(f.get('target')):null,targetEstimated:!!f.get('target')&&f.has('targetEstimated'),base:Number(f.get('base')||0),estimate:f.get('estimate')!==''?Number(f.get('estimate')):null,start:f.get('start')};if(!vals.name)return;let x=id?t:{id:uid(),status:'active',pauses:[],finished:null};Object.assign(x,vals);if(!id)state.tasks.push(x);if(x.target&&!x.targetEstimated&&total(x)>=x.target&&x.status==='active'){x.status='complete';x.finished=today();x.auto=true}else if(x.auto&&(!x.target||x.targetEstimated||total(x)<x.target)){x.status='active';x.finished=null;x.auto=false}dlg.close();save()}}
function editProject(id){let p=state.projects.find(p=>p.id===id);dlg.innerHTML=`<form class="form" id="pform"><h2>${p?'Projekt bearbeiten':'Neues Projekt'}</h2><label>Name<input name="name" required value="${esc(p?.name||'')}"></label><label>Geplante Anzahl Unteraufgaben (optional)<input name="plannedTasks" type="number" min="1" step="1" value="${p?.plannedTasks??''}"></label><small>Noch nicht angelegte Aufgaben zählen mit 0 % zum Projektfortschritt.</small><div class="row"><button class="primary">Speichern</button><button type="button" onclick="dlg.close()">Abbrechen</button>${p?`<button type="button" class="danger" onclick="deleteProject('${p.id}')">Löschen</button>`:''}</div></form>`;dlg.showModal();document.getElementById('pform').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),name=f.get('name').trim(),plannedTasks=f.get('plannedTasks')?Number(f.get('plannedTasks')):null;if(!name)return;if(p)Object.assign(p,{name,plannedTasks});else state.projects.push({id:uid(),name,plannedTasks});dlg.close();save()}}function deleteProject(id){if(confirm('Projekt löschen? Die Aufgaben bleiben als Einzelaufgaben erhalten.')){state.projects=state.projects.filter(p=>p.id!==id);state.tasks.forEach(t=>{if(t.project===id)t.project=''});dlg.close();save()}}
function backup(){return `<h2>Backup</h2><div class="card"><h3>Exportieren</h3><p>Alle Aufgaben, Projekte und täglichen Einträge als JSON sichern.</p><button class="primary" onclick="exportData()">Backup exportieren</button></div><div class="card"><h3>Importieren</h3><p>Ein Backup stellt den gesamten gespeicherten Stand wieder her. Es ersetzt die aktuellen Daten.</p><input type="file" accept=".json,application/json" onchange="importData(this)"></div>`}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({...state,version:2},null,2)],{type:'application/json'}));a.download='progress-tracker-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function importData(el){try{let s=JSON.parse(await el.files[0].text());let validId=x=>typeof x==='string'&&/^[a-zA-Z0-9-]+$/.test(x);let validDate=x=>typeof x==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x);if(!Array.isArray(s.tasks)||!Array.isArray(s.projects)||!s.logs||typeof s.logs!=='object'||!s.tasks.every(t=>validId(t.id)&&typeof t.name==='string'&&validDate(t.start)&&['active','paused','complete'].includes(t.status)&&Array.isArray(t.pauses)&&t.pauses.every(p=>validDate(p.from)&&(!p.to||validDate(p.to)))&&(!t.finished||validDate(t.finished))&&[t.base,t.target,t.estimate].every(v=>v==null||typeof v==='number'&&Number.isFinite(v)&&v>=0))||!s.projects.every(p=>validId(p.id)&&typeof p.name==='string'&&(p.plannedTasks==null||Number.isSafeInteger(p.plannedTasks)&&p.plannedTasks>0))||!Object.entries(s.logs).every(([id,ls])=>validId(id)&&ls&&typeof ls==='object'&&Object.entries(ls).every(([d,l])=>validDate(d)&&l&&['done','skip'].includes(l.status)&&typeof l.amount==='number'&&Number.isFinite(l.amount)&&l.amount>=0)))throw Error();if(confirm('Aktuelle Daten durch dieses Backup ersetzen?')){state={tasks:s.tasks,projects:s.projects,logs:s.logs};save();alert('Backup importiert.')}}catch(e){alert('Ungültiges Backup. Bestehende Daten wurden nicht geändert.')}el.value=''}
function render(){document.getElementById('nav').innerHTML=tabs.map(n=>`<button class="${tab===n?'active':''}" onclick="tab='${n}';render()">${n}</button>`).join('');app.innerHTML=({Dashboard:dashboard,Projekte:projects,Statistik:statistics,Stammdaten:master,Backup:backup}[tab])()}render();setInterval(()=>{let d=today();if(d!==lastToday){if(day===lastToday)day=d;lastToday=d;render()}},15000);if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(console.warn);
</script></body></html>
